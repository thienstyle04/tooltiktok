server {
    # The public router forwards 443 to this LAN address. Tailscale owns its
    # other 443 socket, so never bind 0.0.0.0:443 or [::]:443 here.
    listen 192.168.2.5:443 ssl default_server;
    server_name 113.161.254.76;

    ssl_certificate /etc/letsencrypt-dalat-updates/live/113.161.254.76/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-dalat-updates/live/113.161.254.76/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;

    location ^~ /dalat-studio/updates/ {
        alias /srv/dalat-studio-updates/;
        autoindex off;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / { return 404; }
}
